[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-tower-api"
version = "0.1.0"
description = "Local-first Magic Tower API"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "cryptography==44.0.0",
    "fastapi==0.115.6",
    "pydantic-settings==2.7.1",
    "SQLAlchemy==2.0.36",
    "uvicorn[standard]==0.32.1",
]

[project.scripts]
magic-tower-api = "uvicorn.main:main"

# Explicit so a second top-level directory under backend/ (alembic/ is one) can
# never trip setuptools' flat-layout auto-discovery and break every `uv sync`.
[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-timeout==2.3.1",
    "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A hung test has to fail loudly instead of blocking CI forever. The thread
# method is the only one that can interrupt a test blocked in a C-level call.
timeout = 30
timeout_method = "thread"
