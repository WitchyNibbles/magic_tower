# Alembic owns every schema change; the application writes no DDL of its own.
# Run from backend/: `DATABASE_URL=sqlite:///./workboard.db uv run alembic upgrade head`.
#
# There is deliberately no `sqlalchemy.url` here. alembic/env.py takes the URL from
# DATABASE_URL through app.config.get_settings -- the same object the API reads --
# so the CLI, the container and the running app can never open different files.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
