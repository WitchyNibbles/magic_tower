name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      # tests/test_deadcode_script.py runs the whole dead-code gate, and the gate's
      # knip checker needs the frontend's node_modules: without them knip exits 2
      # ("Error loading vite.config") instead of reporting a count. The backend job
      # therefore installs the frontend too, rather than the test silently skipping
      # the checker it exists to pin.
      - name: Install frontend dependencies (the dead-code gate needs them)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: Run the backend and agent-protocol suite
        working-directory: backend
        run: uv run pytest tests ../tests/agent_protocol

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run the frontend test suite
        working-directory: frontend
        run: npm run test -- --run

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the Docker Compose stack
        run: docker compose build
